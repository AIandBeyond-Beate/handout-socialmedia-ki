name: Deploy to GitHub Pages

on:
  push:
    branches: [main, docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static)
        env:
          # Hardcoded to this repo name so GitHub Pages project URL works out of the box.
          BASE_PATH: ${{ vars.BASE_PATH || '/handout-socialmedia-ki/' }}
        run: bun run build

      - name: Prerender static HTML
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/handout-socialmedia-ki/' }}
        run: node scripts/prerender.mjs

      - name: Locate static output
        id: out
        run: |
          if [ -d ".output/public" ]; then
            echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          elif [ -d "dist/client" ]; then
            echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -d "dist" ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "No static build output found" >&2
            exit 1
          fi

      - name: SPA fallback (copy index.html to 404.html)
        run: |
          if [ -f "${{ steps.out.outputs.dir }}/index.html" ]; then
            cp "${{ steps.out.outputs.dir }}/index.html" "${{ steps.out.outputs.dir }}/404.html"
          fi

      - name: Disable Jekyll
        run: touch "${{ steps.out.outputs.dir }}/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
